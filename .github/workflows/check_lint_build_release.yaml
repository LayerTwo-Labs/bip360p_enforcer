name: Check, Lint, Test, Build, Release

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-prettier:
    name: Check Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Prettier formatting
        uses: actionsx/prettier@v3
        with:
          args: --check .

  check-generated-proto:
    name: Check Generated Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Lint protos
        run: buf lint proto

      - name: Check proto formatting
        run: |
          if ! buf format --diff --exit-code proto; then
            echo "::error::proto/ is not formatted. Run \`just fmt\` locally and commit the result."
            exit 1
          fi

      - name: Regenerate proto code
        run: buf generate --clean

      # `git diff --exit-code` only inspects tracked files; new files added by
      # the regeneration are untracked and would slip past it. `git add -N`
      # marks new files as intent-to-add so they show up in the diff.
      - name: Assert no diff vs checked-in generated code
        run: |
          git add -N lib/proto/generated
          if ! git diff --exit-code lib/proto/generated; then
            echo "::error::lib/proto/generated/ is out of sync with proto/. Run \`just generate\` locally and commit the result."
            exit 1
          fi

  check-rustfmt:
    name: Check Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # nightly is needed for formatting imports correctly
      - name: Install latest nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Check Rust formatting
        # import formatting is nightly only
        run: cargo +nightly fmt --all -- --check

  check-clippy-nightly:
    name: Check Clippy (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy

      - name: Check Clippy
        # We want to hunt for unqualified local imports, but that requires nightly.
        # Nightly introduces a bunch of new errors - we therefore run clippy in
        # two stages: one regular, and one on nightly with specifically only
        # checking for unqualified local imports.
        run: >-
          cargo +nightly clippy -- -A clippy::all -D unqualified_local_imports
          -Zcrate-attr="feature(unqualified_local_imports)"

  check-workspace:
    name: Check workspace (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup install
          rustup component add clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu-workspace

      - name: Cargo check (all targets)
        run: cargo check --workspace --all-targets

      - name: Unit tests
        run: cargo test -p cusf_enforcer_lib

      - name: Clippy (lib)
        run: cargo clippy -p cusf_enforcer_lib -- -D warnings

      - name: Clippy (integration_tests)
        run: cargo clippy -p cusf_enforcer_integration_tests -- -D warnings

      - name: Check integration_tests example
        run: cargo check --example integration_tests

  check-clippy:
    name: Check, Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Must happen /after/ the checkout step, to pick up the toolchain
      # from the `rust-toolchain.toml` file.
      - name: Install toolchain
        run: |
          rustup install 
          rustup component add clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Cargo check
        run: cargo check --all-targets

      - name: Clippy
        run: |
          cargo clippy --all-targets

  check-unused-deps:
    name: Check unused deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-shear
        # Pinned: cargo-shear >= 1.12.0 pulls in deps requiring rustc 1.91,
        # but our toolchain is 1.88.0
        run: cargo binstall --no-confirm cargo-shear@1.11.2

      - name: Check for unused dependencies
        run: cargo shear --deny-warnings

  # Parses `CI_BITCOIN_CORE_VERSIONS` out of `lib/version.rs` and emits
  # the integration-test matrix. Keeping the list of stock versions in
  # source means the Rust-side `SUPPORTED_BITCOIN_CORE_MAJORS` and the CI
  # matrix can't drift — a unit test (`ci_versions_match_majors`) asserts
  # the two are consistent.
  compute-integration-matrix:
    name: Compute integration-test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse CI_BITCOIN_CORE_VERSIONS from lib/version.rs
        id: build
        run: |
          set -euo pipefail
          VERSIONS=$(grep -oE '"[0-9]+\.[0-9]+"' lib/version.rs | tr -d '"')
          COUNT=$(printf '%s\n' "$VERSIONS" | grep -c . || true)
          if [ "$COUNT" -ne 3 ]; then
            echo "expected 3 versions in lib/version.rs, found $COUNT:" >&2
            printf '%s\n' "$VERSIONS" >&2
            exit 1
          fi
          for v in $VERSIONS; do
            if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+$'; then
              echo "invalid version in lib/version.rs: '$v'" >&2
              exit 1
            fi
          done
          ITEMS=''
          for v in $VERSIONS; do
            ITEMS="$ITEMS{\"flavor\":\"stock\",\"version\":\"$v\"},"
          done
          ITEMS="${ITEMS%,}"
          MATRIX="{\"include\":[${ITEMS}]}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "$MATRIX"

  integration-test:
    name: Integration test (Bitcoin Core ${{ matrix.version }})
    needs: compute-integration-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compute-integration-matrix.outputs.matrix) }}
    env:
      ELECTRS_VERSION: v3.2.0
      GRPCURL_VERSION: "1.9.3"
    steps:
      - name: Download Bitcoin Core (stock ${{ matrix.version }})
        run: |
          pushd ..
          VERSION='${{ matrix.version }}'
          TARBALL="bitcoin-${VERSION}-x86_64-linux-gnu.tar.gz"
          wget "https://bitcoincore.org/bin/bitcoin-core-${VERSION}/${TARBALL}"
          tar -xf "${TARBALL}"
          rm "${TARBALL}"
          mv "bitcoin-${VERSION}/bin" bitcoin-bins
          rm -r "bitcoin-${VERSION}"
          chmod +x bitcoin-bins/bitcoind
          chmod +x bitcoin-bins/bitcoin-cli
          chmod +x bitcoin-bins/bitcoin-util
          popd

      - name: Cache electrs binary
        id: cache-electrs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electrs/target/release/electrs
          key: electrs-binary-${{ env.ELECTRS_VERSION }}

      - name: Install electrs
        if: steps.cache-electrs.outputs.cache-hit != 'true'
        run: |
          git clone --branch ${{ env.ELECTRS_VERSION }} --depth 1 https://github.com/mempool/electrs.git ${{ runner.temp }}/electrs
          cd ${{ runner.temp }}/electrs
          cargo build --locked --release

      - uses: actions/checkout@v7

      # `rustup` is already installed on GitHub Actions runners, so
      # this reads the content from our `rust-toolchain.toml` file.
      # Must happen /after/ the checkout step.
      - name: Install Rust toolchain
        run: rustup install

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu

      - name: Build (debug)
        run: cargo build

      # Verify gRPC server reflection with real schema-free clients
      # (grpcurl + buf curl). Reuses this job's bitcoind download and debug
      # build; gated to a single matrix entry since the result does not
      # depend on the Bitcoin Core flavor.
      - name: Install buf
        if: strategy.job-index == 0
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Cache grpcurl
        if: strategy.job-index == 0
        id: cache-grpcurl
        uses: actions/cache@v6
        with:
          path: ~/grpcurl-bin
          key: grpcurl-v${{ env.GRPCURL_VERSION }}

      - name: Install grpcurl
        if: |
          strategy.job-index == 0 &&
          steps.cache-grpcurl.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/grpcurl-bin
          wget -q "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          tar -xzf "grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz" -C ~/grpcurl-bin grpcurl

      - name: Install just
        if: strategy.job-index == 0
        uses: extractions/setup-just@v3

      - name: Verify gRPC reflection (grpcurl + buf curl)
        if: strategy.job-index == 0
        run: |
          export PATH="$HOME/grpcurl-bin:$PATH"
          export BITCOIND='../bitcoin-bins/bitcoind'
          export CUSF_ENFORCER='target/debug/cusf_enforcer'
          just verify-reflection

      - name: Run integration tests
        run: |
          export CUSF_ENFORCER='target/debug/cusf_enforcer'
          export BITCOIND='../bitcoin-bins/bitcoind'
          export BITCOIN_CLI='../bitcoin-bins/bitcoin-cli'
          export BITCOIN_UTIL='../bitcoin-bins/bitcoin-util'
          export ELECTRS='${{ runner.temp }}/electrs/target/release/electrs'
          # Each test leaks a TempDir holding per-component stdout/stderr (the
          # enforcer runs at --log-level=trace). Point TMPDIR at a known
          # directory so the "Upload integration test logs" step can collect
          # them as artifacts when a test fails.
          export TMPDIR="$RUNNER_TEMP/it-logs"
          mkdir -p "$TMPDIR"
          export BITCOIND_UNPATCHED='../bitcoin-bins/bitcoind'
          cargo run --example integration_tests

      - name: Upload integration test logs
        # Only on failure: the leaked TempDirs contain full trace-level
        # enforcer logs plus bitcoind/electrs output, which is what we need to
        # diagnose flakes. Restricted to log files so we don't upload bitcoind
        # block/chainstate data.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-logs-stock-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/it-logs/**/*.txt
            ${{ runner.temp }}/it-logs/**/*.log
          retention-days: 14
          if-no-files-found: warn

  test-build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: x86_64-unknown-linux-gnu
            binary-suffix: ""
            rustflags: ""

          - os: macos-latest-large
            name: x86_64-apple-darwin
            binary-suffix: ""
            rustflags: ""

          - os: macos-latest
            name: aarch64-apple-darwin
            binary-suffix: ""
            rustflags: ""

          - os: ubuntu-latest
            name: x86_64-pc-windows-gnu
            binary-suffix: .exe
            rustflags: "-C linker=/usr/bin/x86_64-w64-mingw32-gcc"

    name: Test, Build, Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [check-clippy, check-clippy-nightly]
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Must happen /after/ the checkout step, to pick up the toolchain
      - run: rustup target add ${{ matrix.name }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Rust toolchain
        run: rustup install

      - name: Install windows-specific deps
        run: sudo apt install mingw-w64 nasm
        if: ${{ matrix.name == 'x86_64-pc-windows-gnu' }}

      - name: Test
        run: cargo test --tests

      - name: Build
        run: cargo build --release --target ${{ matrix.name }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: "Set environment variables: version number and output filenames"
        run: |
          # We still capture the version, but won't use it in the final binary name
          APP_VERSION=$(cargo metadata --format-version 1 | \
            jq -er '.packages | map(select(.name == "cusf_enforcer") | .version) | .[0]')
          # Use 'latest' in the filename instead of the version
          APP_DIRNAME="cusf-enforcer-latest-${{ matrix.name }}"
          APP_FILENAME="${APP_DIRNAME}${{ matrix.binary-suffix }}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_FILENAME=$APP_FILENAME" >> "$GITHUB_ENV"
          echo "APP_DIRNAME=$APP_DIRNAME" >> "$GITHUB_ENV"

      - run: |
          mkdir release
          cp target/${{ matrix.name }}/release/cusf_enforcer${{ matrix.binary-suffix }} release/${{ env.APP_FILENAME }}

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_DIRNAME }}
          if-no-files-found: error
          path: |
            release/${{ env.APP_FILENAME }}

      - name: Release
        uses: softprops/action-gh-release@v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/${{ env.APP_FILENAME }}
          fail_on_unmatched_files: true
